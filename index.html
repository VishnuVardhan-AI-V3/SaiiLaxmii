<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>For my sister ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Caveat:wght@500;600&display=swap');
:root{--bg1:#2a1530;--bg2:#120a18;--ink:#fbeee6;--dim:#c9a9b8;--gold:#f2b661;--rose:#ee8fa0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;background:var(--bg2);color:var(--ink);font-family:Fraunces,Georgia,serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 110%,#7a3550 0%,var(--bg1) 45%,var(--bg2) 100%);padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1}
.fly{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 3px rgba(242,182,97,.55);animation:rise linear infinite}
@keyframes rise{from{transform:translateY(105vh) translateX(0);opacity:0}15%,85%{opacity:.8}to{transform:translateY(-10vh) translateX(30px);opacity:0}}
#prog{position:fixed;top:env(safe-area-inset-top);left:0;height:3px;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));z-index:50;transition:width .8s ease}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:32px 24px 110px;overflow:hidden;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity 1.1s,transform 1.4s cubic-bezier(.2,.8,.2,1),visibility 0s 1.1s;z-index:10}
.scene.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.box{max-width:760px;text-align:center}
.hand{font-family:Caveat,cursive;font-size:clamp(24px,5vw,32px);color:var(--gold);margin-bottom:14px}
.big{font-weight:300;font-size:clamp(40px,9vw,88px);line-height:1.05;letter-spacing:-.02em}
.mid{font-weight:300;font-style:italic;font-size:clamp(24px,4.5vw,40px);line-height:1.4;color:var(--dim);margin-top:22px}
.quote{font-style:italic;font-weight:300;font-size:clamp(26px,5vw,48px);line-height:1.35}
/* intro letter */
.letter{position:relative;width:min(340px,80vw,50dvh);aspect-ratio:1.5;margin:0 auto 36px;background:linear-gradient(160deg,#f4d9c6,#e6b9a6);border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.55);animation:bob 5s ease-in-out infinite}
.letter::before{content:"";position:absolute;inset:0;background:linear-gradient(to bottom right,transparent 49.5%,rgba(120,50,60,.25) 50%) 0 0/100% 100% no-repeat;border-radius:6px;clip-path:polygon(0 0,100% 0,50% 62%)}
.seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8546a,#9c1f3a);display:grid;place-items:center;font-size:26px;box-shadow:0 6px 14px rgba(0,0,0,.4)}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}
.to{font-family:Caveat,cursive;font-size:clamp(38px,9vw,64px);color:var(--ink);line-height:1}
.to b{color:var(--rose);font-weight:600}
/* polaroid */
.polaroid{position:relative;width:min(300px,76vw,44dvh);background:#fbf3ec;padding:14px 14px 22px;border-radius:3px;box-shadow:0 30px 70px rgba(0,0,0,.6);transform:rotate(var(--r,-3deg));animation:sway 7s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(calc(var(--r,-3deg)*-.6)) translateY(-8px)}}
.photo{aspect-ratio:1;border-radius:2px;position:relative;overflow:hidden;background:var(--g)}
.photo::before{content:"";position:absolute;width:38%;aspect-ratio:1;border-radius:50%;left:15%;bottom:34%;background:rgba(20,10,25,.35)}
.photo::after{content:"";position:absolute;width:38%;aspect-ratio:1;border-radius:50%;right:15%;bottom:34%;background:rgba(20,10,25,.28);box-shadow:-70px 60px 0 40px rgba(20,10,25,.25),70px 60px 0 40px rgba(20,10,25,.3)}
.cap{font-family:Caveat,cursive;color:#3a2230;font-size:26px;line-height:1.1;margin-top:14px;text-align:center}
.tape{position:absolute;top:-14px;left:50%;width:90px;height:26px;transform:translateX(-50%) rotate(3deg);background:rgba(242,182,97,.55)}
.sub{margin-top:30px;font-family:Caveat,cursive;font-size:clamp(24px,5vw,30px);color:var(--dim);max-width:340px;text-align:center}
.pl{display:flex;flex-direction:column;align-items:center}
/* pulse */
.pulse{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px;border:1.5px solid var(--rose);border-radius:50%;animation:pulse 2.2s ease-out infinite;opacity:0}
.pulse:nth-child(2){animation-delay:.7s}
@keyframes pulse{from{transform:scale(.4);opacity:.7}to{transform:scale(1.8);opacity:0}}
.final{font-weight:300;font-size:clamp(52px,12vw,116px);line-height:.95}
.final i{color:var(--rose)}
/* controls */
.nav{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:60}
button{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:40px;padding:12px 26px;font-size:15px;backdrop-filter:blur(10px)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#next{background:var(--gold);color:#2a1530;border-color:var(--gold);font-weight:400}
#back{padding:12px 18px}
/* phones & short screens */
@media(max-width:600px){.scene{padding:24px 20px 100px}.big{font-size:clamp(36px,11vw,56px)}.mid{font-size:clamp(22px,6vw,30px)}.quote{font-size:clamp(24px,6.6vw,34px)}.final{font-size:clamp(48px,15vw,76px)}.cap{font-size:23px}.nav{bottom:calc(20px + env(safe-area-inset-bottom))}button{padding:12px 24px}}
@media(max-height:560px){.scene{padding:16px 24px 76px}.big{font-size:clamp(28px,8vh,52px)}.mid{margin-top:12px;font-size:clamp(18px,5vh,26px)}.hand{margin-bottom:6px}.polaroid{width:min(200px,36dvh)}.letter{margin-bottom:16px;width:min(220px,40dvh)}.sub{margin-top:14px}.nav{bottom:12px}}
/* laptops & large screens */
@media(min-width:1000px) and (min-height:700px){.polaroid{width:min(380px,50dvh)}.cap{font-size:32px}.sub{font-size:34px;max-width:460px}.letter{width:min(420px,44dvh)}.seal{width:72px;height:72px;font-size:32px}.hand{font-size:36px}.mid{font-size:44px}button{font-size:16px;padding:14px 32px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="prog"></div>
<div id="fx"></div>
<main id="stage"></main>
<div class="nav"><button id="back" aria-label="Back" hidden>←</button><button id="next">Open</button></div>

<script>
/* ✏️ Put her name here (leave "" to hide) */
const SISTER = "";

const M = (n,cap,note,g,r)=>({t:"m",n,cap,note,g,r});
const S = [
 {t:"intro"},
 {a:"a story about chosen family",b:"Not by blood…",s:"But by heart."},
 {a:"our story",b:"We weren't born<br>into the same family."},
 {b:"We didn't share<br>the same childhood.",s:"We didn't grow up<br>under the same roof."},
 M(1,"The day we became friends.","Some people just become important.","linear-gradient(135deg,#f0a07a,#b0507a 60%,#4a2a5e)",-3),
 {a:"and then…",b:"Somewhere along<br>the way…"},
 {t:"pulse",a:"something changed",b:"You became<br>family."},
 M(2,"The memories we never planned.","And somehow, they became the best ones.","linear-gradient(135deg,#f2b661,#d9667c 55%,#3c2a5a)",3),
 {a:"not because we had to",b:"Because<br>we chose to."},
 {a:"you have seen me",s:"My chaos.<br><br>My stupid moments.<br><br>My good days.<br><br>My bad days."},
 M(3,"The moments that made us us.","We laughed. We argued. We stayed.","linear-gradient(135deg,#8fb3d9,#a06aa8 55%,#3a2450)",-4),
 {a:"and somehow…",b:"You stayed."},
 {a:"people say family",b:"Is about blood."},
 {a:"maybe.",q:"“But sometimes family is the person who isn't related to you… and still feels like home.”"},
 M(4,"Not related. Still inseparable.","Some bonds don't need a family tree.","linear-gradient(135deg,#f6c98f,#e07a85 55%,#4d2b55)",2),
 {a:"so let me say this",b:"You're not my sister<br>by blood."},
 {a:"you're something different",b:"You're my sister<br>by heart."},
 {a:"from another mother",b:"And I'm grateful<br>for that."},
 {a:"whatever happens",b:"Whatever life<br>throws at us…"},
 {a:"remember this",b:"You've got me."},
 {a:"one last thing",b:"Some people are<br>given to us.",s:"Others are found."},
 {t:"final"}
];
const D = [0,4500,4500,4500,6500,4000,5000,6500,4500,6500,6500,4000,4000,6500,6500,4500,4500,4500,4500,4500,5000,0];

const stage = document.getElementById("stage");
const el = (h)=>{const s=document.createElement("section");s.className="scene";s.innerHTML=h;stage.appendChild(s);return s};
const nodes = S.map(x=>{
 if(x.t==="intro") return el(`<div class="box"><div class="letter"><div class="seal">❤️</div></div>
   <div class="hand">a little something</div><div class="to">This is for my <b>sister</b>${SISTER?`,<br>${SISTER}`:""}</div>
   <div class="sub" style="margin:22px auto 0">Take a minute. Open it when you're ready.</div></div>`);
 if(x.t==="m") return el(`<div class="pl"><div class="polaroid" style="--r:${x.r}deg"><div class="tape"></div>
   <div class="photo" style="--g:${x.g}"></div><div class="cap">${x.cap}</div></div><div class="sub">${x.note}</div></div>`);
 if(x.t==="pulse") return el(`<div class="pulse"></div><div class="pulse"></div><div class="box"><div class="hand">${x.a}</div><div class="big">${x.b}</div></div>`);
 if(x.t==="final") return el(`<div class="box"><div class="hand">and I'm glad I found you</div>
   <div class="final">My Sister.<br><i>My Family.</i> ❤️</div>
   <div class="mid">Not by blood. By heart. Forever.</div></div>`);
 return el(`<div class="box">${x.a?`<div class="hand">${x.a}</div>`:""}${x.b?`<div class="big">${x.b}</div>`:""}${x.q?`<div class="quote">${x.q}</div>`:""}${x.s?`<div class="mid">${x.s}</div>`:""}</div>`);
});

/* fireflies */
const fx=document.getElementById("fx");
for(let i=0;i<40;i++){const f=document.createElement("div");f.className="fly";
 f.style.left=Math.random()*100+"%";f.style.animationDuration=9+Math.random()*12+"s";f.style.animationDelay=-Math.random()*15+"s";fx.appendChild(f)}

const next=document.getElementById("next"),back=document.getElementById("back"),prog=document.getElementById("prog");
let cur=-1,timer;
function go(i){
 i=Math.max(0,Math.min(S.length-1,i));
 nodes.forEach((n,k)=>n.classList.toggle("on",k===i));
 cur=i;
 prog.style.width=(i/(S.length-1)*100)+"%";
 back.hidden=i===0;
 next.hidden=i===S.length-1;
 next.textContent=i===0?"Open":"Continue";
 clearTimeout(timer);
 if(i>0&&D[i]) timer=setTimeout(()=>go(cur+1),D[i]);
}
next.onclick=()=>go(cur+1);
back.onclick=()=>go(cur-1);
document.addEventListener("keydown",e=>{
 if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1)}
 if(e.key==="ArrowLeft")go(cur-1);
});
/* swipe on touch screens */
let tx=null;
document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;
 if(Math.abs(d)>50)go(cur+(d<0?1:-1))},{passive:true});
go(0);
</script>
</body>
</html>
