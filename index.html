<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>For my sister ❤️</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300;1,9..144,400&family=Caveat:wght@500;600&display=swap');
@property --c1{syntax:'<color>';inherits:true;initial-value:#7a3550}
@property --c2{syntax:'<color>';inherits:true;initial-value:#2a1530}
@property --c3{syntax:'<color>';inherits:true;initial-value:#120a18}
:root{--c1:#7a3550;--c2:#2a1530;--c3:#120a18;--ink:#fbeee6;--dim:#c9a9b8;--gold:#f2b661;--rose:#ee8fa0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;color:var(--ink);font-family:Fraunces,Georgia,serif;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 110%,var(--c1) 0%,var(--c2) 45%,var(--c3) 100%);transition:--c1 2s,--c2 2s,--c3 2s;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:1}
.fly{position:absolute;width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px 3px var(--gold);animation:rise linear infinite;transition:background 2s}
@keyframes rise{from{transform:translateY(105vh);opacity:0}15%,85%{opacity:.7}to{transform:translateY(-10vh) translateX(30px);opacity:0}}
#prog{position:fixed;top:env(safe-area-inset-top);left:0;height:3px;width:0;background:linear-gradient(90deg,var(--rose),var(--gold));z-index:50;transition:width .8s}
.scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:32px 24px 110px;overflow:hidden;opacity:0;visibility:hidden;transform:translateY(18px);transition:opacity 1.1s,transform 1.4s cubic-bezier(.2,.8,.2,1),visibility 0s 1.1s;z-index:10}
.scene.on{opacity:1;visibility:visible;transform:none;transition-delay:0s}
.box{max-width:760px;text-align:center}
.hand{font-family:Caveat,cursive;font-size:clamp(24px,5vw,34px);color:var(--gold);margin-bottom:14px}
.big{font-weight:300;font-size:clamp(38px,9vw,84px);line-height:1.05;letter-spacing:-.02em}
.mid{font-weight:300;font-style:italic;font-size:clamp(22px,4.5vw,38px);line-height:1.4;color:var(--dim);margin-top:22px}
.quote{font-style:italic;font-weight:300;font-size:clamp(24px,5vw,46px);line-height:1.35}
.qa{font-family:Caveat,cursive;font-size:clamp(22px,4vw,30px);color:var(--gold);margin-top:20px}
.letter{position:relative;width:min(340px,80vw,50dvh);aspect-ratio:1.5;margin:0 auto 32px;background:linear-gradient(160deg,#f4d9c6,#e6b9a6);border-radius:6px;box-shadow:0 30px 60px rgba(0,0,0,.55);animation:bob 5s ease-in-out infinite}
.seal{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8546a,#9c1f3a);display:grid;place-items:center;font-size:26px}
@keyframes bob{50%{transform:translateY(-10px) rotate(-1deg)}}
.to{font-family:Caveat,cursive;font-size:clamp(38px,9vw,64px);line-height:1}.to b{color:var(--rose);font-weight:600}
.pl{display:flex;flex-direction:column;align-items:center}
.polaroid{position:relative;width:min(300px,76vw,44dvh);background:#fbf3ec;padding:14px 14px 22px;border-radius:3px;box-shadow:0 30px 70px rgba(0,0,0,.6);transform:rotate(var(--r,-3deg));animation:sway 7s ease-in-out infinite;cursor:pointer}
@keyframes sway{50%{transform:rotate(calc(var(--r,-3deg)*-.6)) translateY(-8px)}}
.photo{aspect-ratio:1;border-radius:2px;position:relative;overflow:hidden;background:var(--g);display:grid;place-items:center}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo span{font:500 20px Caveat,cursive;color:rgba(255,255,255,.85);text-align:center;padding:10px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.cap{font-family:Caveat,cursive;color:#3a2230;font-size:26px;line-height:1.1;margin-top:14px;text-align:center}
.tape{position:absolute;top:-14px;left:50%;width:90px;height:26px;transform:translateX(-50%) rotate(3deg);background:rgba(242,182,97,.55)}
.sub{margin-top:28px;font-family:Caveat,cursive;font-size:clamp(24px,5vw,30px);color:var(--dim);max-width:340px;text-align:center}
.pulse{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px;border:1.5px solid var(--rose);border-radius:50%;animation:pulse 2.2s ease-out infinite;opacity:0}.pulse:nth-child(2){animation-delay:.7s}
@keyframes pulse{from{transform:scale(.4);opacity:.7}to{transform:scale(1.8);opacity:0}}
/* memory wall */
.wall{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:640px;margin:18px auto 0}
.wall .polaroid{width:100%;padding:8px 8px 12px;animation:none}.wall .cap{font-size:17px;margin-top:8px}
.final{font-weight:300;font-size:clamp(50px,12vw,110px);line-height:.95}.final i{color:var(--rose)}
.nav{position:fixed;bottom:calc(28px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;z-index:60}
button{font:inherit;cursor:pointer;color:var(--ink);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:40px;padding:12px 26px;font-size:15px;backdrop-filter:blur(10px)}
#next{background:var(--gold);color:#2a1530;border-color:var(--gold);transition:background 2s}
#back{padding:12px 18px}
#music{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:60;display:flex;gap:8px;align-items:center}
#music button{padding:8px 14px;font-size:14px}#music label{cursor:pointer;font-size:18px}
#tag{position:fixed;top:calc(18px + env(safe-area-inset-top));left:16px;z-index:60;font:500 20px Caveat,cursive;color:var(--dim)}
@media(max-height:560px){.scene{padding:16px 24px 76px}.polaroid{width:min(200px,36dvh)}.letter{width:min(220px,40dvh)}.nav{bottom:12px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="prog"></div><div id="fx"></div><div id="tag"></div>
<div id="music"><button id="mb" aria-label="Toggle music">🎵 Music off</button><label title="Use your own song">Sai<input type="file" id="mf" accept="audio/*" hidden></label></div>
<main id="stage"></main>
<div class="nav"><button id="back" hidden>←</button><button id="next">Open</button></div>

<script>
/* ✏️ EDIT ME ─────────────────────────────── */
const SISTER = "Saii Laxmii";           // her name, or ""
const MUSIC_FILE = "music.mp3";       // e.g. "song.mp3" to use your own song by default
// Themes: colors + mood name + music chords (MIDI notes). Each scene picks one with th:
const TH = [
 {n:"warm",   c:["#7a3550","#2a1530","#120a18"],gold:"#f2b661",rose:"#ee8fa0",ch:[[57,64,69],[53,60,65],[55,62,67],[52,59,64]]},
 {n:"golden", c:["#a8642a","#3a1c18","#160a0a"],gold:"#ffcf70",rose:"#ff9a7a",ch:[[60,67,72],[57,64,69],[53,60,65],[55,62,67]]},
 {n:"ocean",  c:["#2a6a8a","#12233d","#070d1a"],gold:"#9fe3ff",rose:"#8fb3ff",ch:[[52,59,64],[48,55,60],[50,57,62],[47,54,59]]},
 {n:"dusk",   c:["#6a3a9a","#22123f","#0c0718"],gold:"#e3b8ff",rose:"#ff8fc7",ch:[[55,62,67],[52,59,64],[57,64,69],[50,57,62]]},
 {n:"forest", c:["#2f7a5a","#10281f","#060f0b"],gold:"#b6f2a0",rose:"#f2c7a0",ch:[[53,60,65],[50,57,62],[55,62,67],[48,55,60]]}
];
// Photos: put files in an images/ folder and set src:"images/a.jpg". Empty = tap the frame to add one.
const PHOTOS = [
 {src:"pic4.jpg",cap:"The day we became friends"},{src:"pic3.jpg",cap:"The memories we never planned"},
 {src:"pic2.jpg",cap:"The moments that made us us"},{src:"pic1.jpg",cap:"Not related. Still inseparable."}
];
/* Quotes (with authors) */
const Q = {
 bach:["“The bond that links your true family is not one of blood, but of respect and joy in each other's life.”","Richard Bach"],
 howard:["“Call it clan, call it tribe, call it network, call it family: whatever you call it, whoever you are, you need one.”","Jane Howard"],
 buch:["““We weren’t born to the same story, but somehow, you became one of my favorite chapters.””","Goutham"],
 fishel:["“A sister is both your mirror — and your opposite.”","Elizabeth Fishel"],
 saline:["“Sisters function as safety nets in a chaotic world simply by being there for each other.”","Carol Saline"],
 haley:["“The family is a link to our past, a bridge to our future.”","Alex Haley"],
 fox:["“Family is not an important thing. It's everything.”","Michael J. Fox"]
};
/* ─────────────────────────────────────────── */
const P = (i,g,r,th)=>({t:"m",i,g,r,th});
const S = [
 {t:"intro",th:0},
 {a:"a story about chosen family",b:"Not by blood…",s:"But by heart.",th:0},
 {a:"our story",b:"We weren't born<br>into the same family.",th:0},
 {b:"We didn't share<br>the same childhood.",s:"We didn't grow up<br>under the same roof.",th:2},
 P(0,"linear-gradient(135deg,#f0a07a,#b0507a 60%,#4a2a5e)",-3,1),
 {a:"and then…",b:"Somewhere along<br>the way…",th:3},
 {t:"pulse",a:"something changed",b:"You became<br>family.",th:0},
 P(1,"linear-gradient(135deg,#f2b661,#d9667c 55%,#3c2a5a)",3,1),
 {q:Q.buch,th:4},
 {a:"not because we had to",b:"Because<br>we chose to.",th:4},
 {q:Q.fishel,th:3},
 {a:"you have seen me",s:"My chaos.<br><br>My stupid moments.<br><br>My good days.<br><br>My bad days.",th:2},
 P(2,"linear-gradient(135deg,#8fb3d9,#a06aa8 55%,#3a2450)",-4,2),
 {a:"and somehow…",b:"You stayed.",th:3},
 {q:Q.saline,th:2},
 {q:Q.bach,th:3},
 P(3,"linear-gradient(135deg,#f6c98f,#e07a85 55%,#4d2b55)",2,1),
 {q:Q.howard,th:1},
 {a:"so let me say this",b:"You're not my sister<br>by blood.",th:0},
 {a:"you're something different",b:"You're my sister<br>by heart.",th:1},
 {q:Q.haley,th:4},
 {a:"whatever happens",b:"Whatever life<br>throws at us…",th:2},
 {a:"remember this",b:"You've got me.",th:0},
 {q:Q.fox,th:0},
 {a:"one last thing",b:"Some people are<br>given to us.",s:"Others are found.",th:3},
 {t:"wall",th:1},
 {t:"final",th:0}
];
const D=S.map(x=>x.t==="intro"||x.t==="final"||x.t==="wall"?0:x.t==="m"?6500:x.q?7500:x.s&&x.s.length>40?6500:4500);

const stage=document.getElementById("stage");
const el=h=>{const s=document.createElement("section");s.className="scene";s.innerHTML=h;stage.appendChild(s);return s};
function photo(i,g){const p=PHOTOS[i]||{};return `<div class="photo" style="--g:${g}" data-i="${i}">${p.src?`<img src="${p.src}" alt="${p.cap||""}">`:`<span>tap to add<br>a photo 📷</span>`}</div>`}
const nodes=S.map(x=>{
 if(x.t==="intro")return el(`<div class="box"><div class="letter"><div class="seal">❤️</div></div><div class="hand">a little something</div><div class="to">This is for my <b>sister</b>${SISTER?`,<br>${SISTER}`:""}</div><div class="sub" style="margin:20px auto 0">Turn the music on. Open it when you're ready.</div></div>`);
 if(x.t==="m"){const p=PHOTOS[x.i]||{};return el(`<div class="pl"><div class="polaroid" style="--r:${x.r}deg"><div class="tape"></div>${photo(x.i,x.g)}<div class="cap">${p.cap||""}</div></div><div class="sub">${["Some people just become important.","And somehow, they became the best ones.","We laughed. We argued. We stayed.","Some bonds don't need a family tree."][x.i]||""}</div></div>`)}
 if(x.t==="wall")return el(`<div class="box"><div class="hand">all of it, together</div><div class="wall">${PHOTOS.map((p,i)=>`<div class="polaroid" style="--r:${[-3,2,3,-2][i%4]}deg"><div class="tape" style="width:50px;height:16px;top:-8px"></div>${photo(i,["#f0a07a,#b0507a","#f2b661,#d9667c","#8fb3d9,#a06aa8","#f6c98f,#e07a85"].map(c=>`linear-gradient(135deg,${c})`)[i%4])}<div class="cap">${p.cap||""}</div></div>`).join("")}</div></div>`);
 if(x.t==="pulse")return el(`<div class="pulse"></div><div class="pulse"></div><div class="box"><div class="hand">${x.a}</div><div class="big">${x.b}</div></div>`);
 if(x.t==="final")return el(`<div class="box"><div class="hand">and I'm glad I found you</div><div class="final">My Sister.<br><i>My Family.</i> ❤️</div><div class="mid">Not by blood. By heart. Forever.</div></div>`);
 if(x.q)return el(`<div class="box"><div class="quote">${x.q[0]}</div><div class="qa">— ${x.q[1]}</div></div>`);
 return el(`<div class="box">${x.a?`<div class="hand">${x.a}</div>`:""}${x.b?`<div class="big">${x.b}</div>`:""}${x.s?`<div class="mid">${x.s}</div>`:""}</div>`);
});

/* add photos by tapping a frame (preview; use PHOTOS[].src to make permanent) */
stage.addEventListener("click",e=>{const ph=e.target.closest(".photo");if(!ph||ph.querySelector("img"))return;
 const inp=document.createElement("input");inp.type="file";inp.accept="image/*";
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const url=URL.createObjectURL(f),i=ph.dataset.i;PHOTOS[i].src=url;
  document.querySelectorAll(`.photo[data-i="${i}"]`).forEach(p=>{p.innerHTML=`<img src="${url}" alt="">`})};inp.click();
 e.stopPropagation()});

/* fireflies */
const fx=document.getElementById("fx");
for(let i=0;i<36;i++){const f=document.createElement("div");f.className="fly";f.style.left=Math.random()*100+"%";f.style.animationDuration=9+Math.random()*12+"s";f.style.animationDelay=-Math.random()*15+"s";fx.appendChild(f)}

/* theme: each scene's quote/mood recolors the whole UI */
const root=document.documentElement,body=document.body;
function theme(k){const t=TH[k];root.style.setProperty("--c1",t.c[0]);root.style.setProperty("--c2",t.c[1]);root.style.setProperty("--c3",t.c[2]);root.style.setProperty("--gold",t.gold);root.style.setProperty("--rose",t.rose);
 document.getElementById("tag").textContent="· "+t.n+" ·";chord=0}

/* music: generated ambient pads that follow the theme, or your own file */
let ac,master,step,on=false,chord=0,cur=-1,timer,custom=null,thi=0;
const audio=new Audio();audio.loop=true;
const hz=n=>440*Math.pow(2,(n-69)/12);
function pad(){const c=TH[thi].ch,notes=c[chord++%c.length],t=ac.currentTime;
 notes.forEach((n,i)=>{const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();o.type=i?"sine":"triangle";o.frequency.value=hz(n);o.detune.value=(Math.random()-.5)*10;f.type="lowpass";f.frequency.value=1000;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.15,t+2);g.gain.linearRampToValueAtTime(0,t+6.5);o.connect(f);f.connect(g);g.connect(master);o.start(t);o.stop(t+7)})}
const mb=document.getElementById("mb");
function musicOn(){on=true;mb.textContent="🎵 Music on";
 if(custom||MUSIC_FILE){audio.src=custom||MUSIC_FILE;audio.play()}
 else{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.7;master.connect(ac.destination)}ac.resume();pad();step=setInterval(pad,5000)}}
function musicOff(){on=false;mb.textContent="🎵 Music off";audio.pause();clearInterval(step)}
mb.onclick=()=>on?musicOff():musicOn();
document.getElementById("mf").onchange=e=>{const f=e.target.files[0];if(!f)return;custom=URL.createObjectURL(f);if(on)musicOff();musicOn()};

/* navigation */
const next=document.getElementById("next"),back=document.getElementById("back"),prog=document.getElementById("prog");
function go(i){i=Math.max(0,Math.min(S.length-1,i));
 nodes.forEach((n,k)=>n.classList.toggle("on",k===i));
 if(S[i].th!==thi||cur<0){thi=S[i].th;theme(thi)}
 if(cur===0&&i===1&&!on)musicOn(); // first tap on "Open" starts the music
 cur=i;prog.style.width=i/(S.length-1)*100+"%";back.hidden=i===0;next.hidden=i===S.length-1;next.textContent=i===0?"Open":"Continue";
 clearTimeout(timer);if(i>0&&D[i])timer=setTimeout(()=>go(cur+1),D[i])}
next.onclick=()=>go(cur+1);back.onclick=()=>go(cur-1);
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();go(cur+1)}if(e.key==="ArrowLeft")go(cur-1)});
let tx=null;document.addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null)return;const d=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(d)>50)go(cur+(d<0?1:-1))},{passive:true});
go(0);
</script>
</body>
</html>
